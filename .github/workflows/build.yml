name: Build Person Detection UF2

on:
  push:
    branches: [ master ]
  workflow_dispatch:  # permite ejecutarlo manualmente

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake \
            gcc-arm-none-eabi libnewlib-arm-none-eabi \
            build-essential git python3 \
            libstdc++-arm-none-eabi-newlib

      - name: Clonar pico-sdk
        run: |
          git clone https://github.com/raspberrypi/pico-sdk.git $HOME/pico-sdk
          cd $HOME/pico-sdk && git submodule update --init
          echo "PICO_SDK_PATH=$HOME/pico-sdk" >> $GITHUB_ENV
      - name: Compilar elf2uf2
        run: |
          mkdir -p $HOME/pico-sdk/tools/elf2uf2/build
          cd $HOME/pico-sdk/tools/elf2uf2/build
          cmake ..
          make
      - name: Compilar
        run: |
          cd tflmicro
          mkdir build && cd build
          cmake .. -DPICO_BOARD=pico \
            -DCMAKE_CXX_FLAGS="-include limits"
          make -j4 blink_test

      - name: Convertir ELF a UF2 correctamente
        run: |
          $HOME/pico-sdk/tools/elf2uf2/build/elf2uf2 \
            tflmicro/build/blink_test.elf \
            tflmicro/build/blink_test_fixed.uf2

      - name: Verificar binario
        run: |
          ls -la tflmicro/build/blink_test.uf2
          wc -c tflmicro/build/blink_test.uf2
          file tflmicro/build/blink_test.uf2

      - name: Verificar UF2
        run: |
          ls -la tflmicro/build/blink_test.uf2
          hexdump -C tflmicro/build/blink_test.uf2 | head -5
          find tflmicro/build -name "*.uf2" -ls

      - name: Subir .uf2 como artifact
        uses: actions/upload-artifact@v4
        with:
          name: person_detection_uf2
          path: tflmicro/build/blink_test_fixed.uf2
